<!DOCTYPE html>
<html lang="en">

<head>
    <title>PDF Viewer | ChicagoPedwayMap.com</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./pdfviewer/pedway-pdf-viewer.css">
    <link rel="shortcut icon" type="image/png" href="PedwayFlavicon.png">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EM934VK7RC"></script>
    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }
        gtag('js', new Date());
        gtag('config', 'G-EM934VK7RC');
    </script>

    <style>
        .doc-head {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px 14px;
            padding: 10px 16px;
            background: #1d1d1e;
            color: #fff;
            font-family: "Roboto", sans-serif;
            text-align: left;
        }

        .doc-head h1 {
            flex: 1;
            min-width: 0;
            margin: 0;
            font-size: clamp(18px, 3.5vw, 24px);
            font-weight: 900;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .doc-head a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 40px;
            padding: 8px 14px;
            border-radius: 4px;
            background: #302665;
            border-left: 5px solid #FFE385;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.03em;
            text-decoration: none;
            white-space: nowrap;
        }

        .doc-head a:hover {
            background: #BB8C09;
        }

        .doc-head a[hidden] {
            display: none;
        }

        #doc {
            --ppv-height: calc(100vh - 150px);
            --ppv-height: calc(100dvh - 150px);
            min-height: 360px;
        }

        .doc-error {
            padding: 40px 16px;
            color: #fff;
            font-family: "Roboto", sans-serif;
            font-size: 18px;
        }

        .doc-error a {
            color: #FFE385;
        }
    </style>
</head>

<body>
    <object type="text/html" width=100% height="50" data="header.html"></object>
    <div class="topnav">
        <a href="index.html">Full Pedway Map</a>
        <a href="3dMap.html">3D Map</a>
        <a href="extras.html"> Extras</a>
        <a href="timeline.html"> Historical Maps</a>
        <a href="contact.html"> Feedback</a>
    </div>

    <div class="doc-head">
        <h1 id="doc-title">PDF</h1>
        <a id="doc-source" href="#" target="_blank" rel="noopener" hidden>Original source &#8599;</a>
    </div>

    <main id="doc"></main>

    <script type="module">
        import { mountPdfViewer } from './pdfviewer/pedway-pdf-viewer.js';

        const params = new URLSearchParams(location.search);
        const file = params.get('file') || '';
        const titleEl = document.getElementById('doc-title');
        const sourceEl = document.getElementById('doc-source');
        const docEl = document.getElementById('doc');

        // Only open PDFs hosted on this site (Documents/ folder or the main map),
        // so this page can't be used to show arbitrary content.
        const allowed = /^(Documents\/[\w\- .%()]+\.pdf|PedwayMap\.pdf)$/i.test(file) && !file.includes('..');

        // Optional link to where the document originally came from (http/https only).
        let source = null;
        try {
            const u = new URL(params.get('source') || '');
            if (u.protocol === 'https:' || u.protocol === 'http:') source = u.href;
        } catch (e) { /* no source */ }

        const name = decodeURIComponent(file.split('/').pop() || '').replace(/\.pdf$/i, '').replace(/[_-]+/g, ' ');
        const title = (params.get('title') || name || 'PDF').slice(0, 120);
        titleEl.textContent = title;
        document.title = title + ' | ChicagoPedwayMap.com';

        if (source) {
            sourceEl.href = source;
            sourceEl.hidden = false;
        }

        if (!allowed) {
            docEl.className = 'doc-error';
            docEl.innerHTML = 'That document isn’t available here. <a href="extras.html">Browse the Extras page</a> for Pedway documents.';
        } else {
            mountPdfViewer(docEl, {
                src: file,
                title,
                layout: 'toolbar',
                sourceUrl: source,
                downloadName: decodeURIComponent(file.split('/').pop())
            });
        }
    </script>

    <footer>
        ChicagoPedwayMap 2026
        <span class="links"><a href="contact.html">Contact Me</a></span>
    </footer>
</body>

</html>
