function sm(p,t,mx=4){const o=[p[0]];for(let i=1;i<p.length-1;i++){const A=p[i-1],B=p[i],C=p[i+1],la=Math.hypot(A[0]-B[0],A[1]-B[1]),lc=Math.hypot(C[0]-B[0],C[1]-B[1]);if(!la||!lc||Math.acos(Math.max(-1,Math.min(1,((B[0]-A[0])*(C[0]-B[0])+(B[1]-A[1])*(C[1]-B[1]))/(la*lc))))>mx){o.push(B);continue}const a=Math.min(t,la/2),c=Math.min(t,lc/2),p1=[B[0]+(A[0]-B[0])*a/la,B[1]+(A[1]-B[1])*a/la],p2=[B[0]+(C[0]-B[0])*c/lc,B[1]+(C[1]-B[1])*c/lc];for(let s=0;s<=8;s++){const u=s/8,v=1-u;o.push([v*v*p1[0]+2*u*v*B[0]+u*u*p2[0],v*v*p1[1]+2*u*v*B[1]+u*u*p2[1]])}}o.push(p[p.length-1]);return o}

const tg=new THREE.Vector3(0,-7.5,0);let th=-.5,ph=.95,r=1150;

/* Autodesk Inventor / AutoCAD style navigation: wheel = zoom at cursor, middle-drag or right-drag = pan, left-drag or Shift+middle-drag = orbit,

const el=ren.domElement,ps=new Map(),HOME=[-.5,.95,1150];let pd=0,pc=null,lastMid=0;
const clampR=v=>Math.max(60,Math.min(3500,v));
function camAxes(){const f=new THREE.Vector3().subVectors(tg,cam.position).normalize(),rt=new THREE.Vector3().crossVectors(f,cam.up).normalize(),up=new THREE.Vector3().crossVectors(rt,f).normalize();return{rt,up}}
/* Pan constraint: looking steeper than 45° down -> slide only in the ground (x,y) plane, the point under the cursor follows the mouse;
   shallower -> slide only vertically (Z) and along whichever ground axis (x or y) is most perpendicular to the view direction. */
const rcst=new THREE.Raycaster(),gpl=new THREE.Plane(new THREE.Vector3(0,1,0),0),pA=new THREE.Vector3(),pB=new THREE.Vector3();
function groundPt(x,y,out){rcst.setFromCamera({x:(x/el.clientWidth)*2-1,y:1-(y/el.clientHeight)*2},cam);return rcst.ray.intersectPlane(gpl,out)}
function panPx(dx,dy,x,y){const k=2*r*Math.tan(cam.fov*Math.PI/360)/el.clientHeight;
 if(ph<Math.PI/4){gpl.constant=-tg.y;if(groundPt(x-dx,y-dy,pA)&&groundPt(x,y,pB)){tg.x+=pA.x-pB.x;tg.z+=pA.z-pB.z}return}
 const a=camAxes(),ax=Math.abs(a.rt.x)>=Math.abs(a.rt.z)?'x':'z';tg[ax]+=-dx*k/a.rt[ax];tg.y+=dy*k}
function orbitPx(dx,dy){th-=dx*.006;ph=Math.max(.02,Math.min(Math.PI-.02,ph-dy*.006))}
function zoomAt(f,cx,cy){const nr=clampR(r*f),ff=nr/r,hh=r*Math.tan(cam.fov*Math.PI/360),hw=hh*cam.aspect,nx=(cx/el.clientWidth)*2-1,ny=1-(cy/el.clientHeight)*2,a=camAxes();
 tg.addScaledVector(a.rt,nx*hw*(1-ff)).addScaledVector(a.up,ny*hh*(1-ff));r=nr}

 if(ps.size==2){const [a,b]=[...ps.values()],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),c=[(a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2];
